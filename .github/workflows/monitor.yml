name: monitor
on:
  schedule:
    - cron: "7 * * * *"      # cada hora
  workflow_dispatch:
permissions:
  contents: write
concurrency: monitor
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Consultar billeteras
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python monitor.py
      - name: Guardar resultados
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data.json historial.jsonl
          git diff --cached --quiet || git commit -m "monitor: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
